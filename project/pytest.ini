[pytest]
testpaths = tests
addopts = -q

# 禁止 pytest 清理旧的临时目录。
#
# pytest 默认只保留最近 3 个 numbered dir，更早的会在**下次启动时删除**。
# 本机的 safe-delete 守卫按轮统计删除数（阈值 50），这批清理会把额度打爆，
# 表现为一堆 teardown ERROR —— 测试本体其实全过，报错却指向 sitecustomize.py，
# 极易误判成代码问题。
#
# 临时目录落在 runs/.pytest_tmp/，是纯抛弃品，攒着无害；
# 要清空时整个目录 mv 走即可（mv 不触发删除守卫）。
tmp_path_retention_count = 100000
tmp_path_retention_policy = all
