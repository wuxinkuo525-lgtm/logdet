# 变体：长跑，给「衰减分叉」提供起点。
# 全程恒定学习率跑 12 个 epoch，每 4 个 epoch 另存一个永久的里程碑存档（milestone_iter_*.pth），
# 之后从第 8、12 个 epoch 的里程碑分叉出去降学习率（mods/decay.yaml）。
#
# 恒定学习率阶段每个 epoch 的评测分数本身不可靠：第一次集群结果里它是抖的甚至下降
# （0.225 → 0.210 → 0.188），降了学习率才升到 0.2333。所以不要从这条曲线上读「第几个 epoch 最好」，
# 只比降学习率之后的分数。结果显示越长越好时，把 epochs 改成 16 续训即可，前面跑的不浪费。
epochs: 12
lr_decay_epochs: []
keep_ckpt_every_epochs: 4
